<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet Chaos self-test</title>
<!-- Developer tool: automatic checks of the game rules (era challenges, era mechanics,
     records, daily challenge, operating systems, saves, offline progress, Czech texts and a
     full simulated playthrough). Open it through a local web server, for example
     `python -m http.server`, then http://localhost:8000/tools/selftest.html.
     It runs on fresh in-memory games and never touches your saved game. The page title
     turns to "passed N/N" or "FAILED k/N" when it is done. -->
<style>
  body { margin: 0; padding: 16px; font: 14px/1.45 system-ui, sans-serif; background: #f4f6fa; color: #1a2233; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #sum { margin: 0 0 14px; font-weight: 600; }
  section { background: #fff; border: 1px solid #d9dfea; border-radius: 8px; padding: 10px 14px; margin: 0 0 10px; }
  h2 { font-size: 15px; margin: 0 0 6px; }
  .ok { color: #137a3a; } .bad { color: #b3261e; font-weight: 600; } .info { color: #4a5568; }
  li { margin: 1px 0; } ul { margin: 0; padding-left: 20px; }
  pre { white-space: pre-wrap; font-size: 12px; background: #f7f8fb; padding: 8px; border-radius: 6px; max-height: 260px; overflow: auto; }
</style>
<script>
  // Czech texts are checked too: the language is read from storage while js/i18n.js loads,
  // so it is set for that moment only and put back right after.
  window.__langBefore = (function () { try { return localStorage.getItem('internet-chaos:lang'); } catch (e) { return null; } })();
  try { localStorage.setItem('internet-chaos:lang', 'cs'); } catch (e) { /* Czech checks are skipped */ }
</script>
</head>
<body>
<h1>Internet Chaos self-test</h1>
<p id="sum">Running…</p>
<div id="out"></div>
<script src="../js/core.js"></script>
<script src="../js/format.js"></script>
<script src="../js/config.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/lang/cs.js"></script>
<script>
  try {
    if (window.__langBefore === null) localStorage.removeItem('internet-chaos:lang');
    else localStorage.setItem('internet-chaos:lang', window.__langBefore);
  } catch (e) { /* nothing to restore */ }
</script>
<script src="../js/content/buildings.js"></script>
<script src="../js/content/upgrades.js"></script>
<script src="../js/content/events.js"></script>
<script src="../js/content/perks.js"></script>
<script src="../js/content/achievements.js"></script>

<script src="../js/content/reboot.js"></script>
<script src="../js/content/cosmetics.js"></script>
<script src="../js/content/sponsors.js"></script>

<script src="../js/systems/economy.js"></script>
<script src="../js/systems/effects.js"></script>
<script src="../js/systems/events.js"></script>
<script src="../js/systems/actions.js"></script>
<script src="../js/systems/progression.js"></script>
<script src="../js/systems/reboot.js"></script>
<script src="../js/systems/bonus.js"></script>
<script src="../js/systems/idle.js"></script>
<script src="../js/systems/os.js"></script>
<script src="../js/systems/meta.js"></script>
<script src="../js/systems/eramech.js"></script>
<script src="../js/systems/game.js"></script>
<script src="../js/save.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  const Z = window.ICHAOS;
  const results = [];
  let current = null;

  function group(name, fn) {
    current = { name, checks: [], notes: [], error: null };
    results.push(current);
    try { fn(); } catch (err) { current.error = err && err.stack ? err.stack : String(err); }
  }
  function ok(cond, text) { current.checks.push({ pass: !!cond, text }); return !!cond; }
  function eq(a, b, text) { return ok(a === b, text + (a === b ? '' : ' (got ' + JSON.stringify(a) + ', expected ' + JSON.stringify(b) + ')')); }
  function note(text) { current.notes.push(text); }
  const near = (a, b, eps) => Math.abs(a - b) <= (eps || 1e-9) * Math.max(1, Math.abs(b));

  /** A fresh in-memory game in `era` on operating system `os`. Notifications are collected. */
  function game(era, os, seed) {
    const s = Z.state.create(Date.now());
    s.seed = seed === undefined ? 7 : seed;
    const g = Z.createGame(s);
    g.log = [];
    g.notify = (type, data) => g.log.push({ type, data });
    if (os) s.os = { id: os, installed: Date.now(), base: {} };
    if (era && era > 1) { s.era = era; Z.prestige.resetRun(g); }
    s.flags.reveal.chaos = true;
    s.flags.reveal.stability = true;
    g.dirty = true;
    g.refresh();
    return g;
  }
  function run(g, seconds, dt, until) {
    const step = dt || 0.5;
    for (let t = 0; t < seconds; t += step) { g.tick(step); if (until && until(g)) return true; }
    return false;
  }
  const mechLog = g => g.log.filter(n => n.type === 'mech').map(n => n.data);

  /* ================= 1. Era challenges ================= */
  group('1 · Era challenges', () => {
    eq(Z.CHALLENGES.length, 21, '21 challenges');
    const ids = new Set(Z.CHALLENGES.map(c => c.id));
    eq(ids.size, 21, 'challenge ids are unique');
    for (let era = 1; era <= 7; era++) eq(Z.challengesFor(era).length, 3, 'era ' + era + ' has 3 challenges');
    ok(Z.challengesFor(9).every(c => c.era === 7), 'eras past 7 reuse the Post-Internet set');
    for (const c of Z.CHALLENGES) {
      ok(c.bonus >= 0.05 && c.bonus <= 0.2, c.id + ': bonus ' + c.bonus + ' in range');
      ok(c.end ? typeof c.ok === 'function' && typeof c.status === 'function' : typeof c.have === 'function' && c.need > 0, c.id + ': complete definition');
    }
    // challengeState for every challenge on a fresh game of its era
    for (let era = 1; era <= 7; era++) {
      const g = game(era);
      for (const c of Z.challengesFor(era)) {
        const st = Z.meta.challengeState(g.s, c);
        ok(['done', 'track', 'failed', 'progress'].includes(st.status) && typeof st.text === 'string', c.id + ': state "' + st.status + '" · ' + st.text);
      }
    }

    // Counting "this era" only, completion, bonus, prestige
    const g = game(3);
    const s = g.s;
    s.flags.ev['act:leak'] = 9;          // used before this era: must not count
    Z.meta.snapshotRun(s);
    eq(Z.meta.challengeState(s, Z.CHALLENGE['v-leak']).have, 0, 'uses from before the era do not count');
    s.flags.ev['act:leak'] = 12;         // 3 this era
    Z.meta.checkChallenges(g);
    ok(!s.challenges.run['v-leak'], 'Serial Leaker not done at 3 / 4');
    s.flags.ev['act:leak'] = 13;
    Z.meta.checkChallenges(g);
    ok(s.challenges.run['v-leak'] && s.challenges.done['v-leak'] > 0, 'Serial Leaker completes at 4 / 4');
    ok(g.log.some(n => n.type === 'challenge' && n.data.c.id === 'v-leak'), 'completion is announced');
    // real action use counts
    const g2 = game(3);
    g2.s.res.money = 1e30; g2.s.cooldowns = {};
    let used = 0;
    for (let i = 0; i < 4; i++) { g2.s.cooldowns = {}; if (Z.actions.use(g2, 'leak')) used++; }
    Z.meta.checkChallenges(g2);
    note('Fake Leak used ' + used + '× by the real action code');
    ok(used < 4 || g2.s.challenges.run['v-leak'], 'using the real Fake Leak action 4× completes the challenge');

    s.run.minStab = 100;
    const bonus = Z.meta.challengeBonus(s);
    ok(near(bonus, 0.1 + 0.15), 'bonus = Serial Leaker 10% + Never Below 50 on track 15% (got ' + bonus + ')');
    s.run.attention = Z.prestige.requirement(s) * 4;
    const raw = Math.floor(Z.prestige.cloutGain(s) / (1 + bonus));
    ok(Z.prestige.cloutGain(s) >= raw && Z.prestige.cloutGain(s) > 0, 'Clout gain includes the bonus (' + Z.prestige.cloutGain(s) + ')');
    s.run.time = 900;
    const gain = Z.prestige.prestige(g);
    ok(gain > 0, 'next era started, +' + gain + ' Clout');
    eq(s.era, 4, 'now era 4');
    ok(s.challenges.done['v-stable'] > 0, 'era-long Never Below 50 sealed as done at the era end');
    eq(Object.keys(s.challenges.run).length, 0, 'this-era challenge list cleared');
    ok(s.challenges.done['v-leak'] > 0, 'completed challenges stay in the lifetime list');
    eq(s.history.length, 1, 'era record written');
    eq(s.history[0].challenges, 2, 'record counts the 2 challenges done');

    // A failed era-long challenge
    const g3 = game(1);
    g3.s.run.time = 1801;
    eq(Z.meta.challengeState(g3.s, Z.CHALLENGE['f-speed']).status, 'failed', 'Dial-up Speedrun fails after 30 minutes');
    g3.s.run.meltdowns = 1;
    eq(Z.meta.challengeState(g3.s, Z.CHALLENGE['f-calm']).status, 'failed', 'Netiquette fails after a meltdown');
    Z.meta.sealEnd(g3);
    ok(!g3.s.challenges.run['f-speed'] && !g3.s.challenges.run['f-calm'], 'failed challenges are not sealed');
  });

  /* ================= 2. Era mechanics ================= */
  group('2 · One mechanic per era', () => {
    const kinds = ['flame', 'friends', 'trend', 'feed', 'claim', 'quarter', 'bots', 'bots'];
    for (let era = 1; era <= 8; era++) eq(Z.mech.kind(game(era).s), kinds[era - 1], 'era ' + era + ' → ' + kinds[era - 1]);
    for (const b of ['flameWar', 'trendWave', 'aiHype', 'stockSurge', 'botHelp', 'botWall']) ok(Z.BUFFS[b], 'buff ' + b + ' exists');

    // Not before the player knows Chaos
    const g0 = game(1);
    g0.s.flags.reveal.chaos = false;
    run(g0, 200);
    ok(!g0.s.mech.active, 'no flame war before Chaos is introduced');

    // 1 Flame wars: put out
    let g = game(1);
    g.s.run.time = 60;
    ok(run(g, 200, 0.5, x => !!x.s.mech.active), 'flame war breaks out within ~2 minutes');
    ok(g.s.buffs.some(b => b.key === 'flameWar'), 'flame war buff is active');
    ok(Z.mech.view(g).buttons[0].id === 'douse', 'window shows the Douse button');
    let clicks = 0;
    while (g.s.mech.active && clicks < 40) { Z.mech.act(g, 'douse'); clicks++; }
    ok(!g.s.mech.active, 'doused after ' + clicks + ' clicks');
    eq(g.s.flags.ev['mech:flameWin'], 1, 'flame win counted');
    ok(!g.s.buffs.some(b => b.key === 'flameWar'), 'flame war buff removed');
    // 1 Flame wars: burn out
    g = game(1);
    g.s.run.time = 60;
    run(g, 200, 0.5, x => !!x.s.mech.active);
    const stab = g.s.res.stability;
    run(g, 60, 0.5, x => !x.s.mech.active);
    ok(!g.s.mech.active && mechLog(g).some(n => n.title === 'The flame war burned out'), 'ignored flame war burns out');
    note('Stability ' + stab.toFixed(1) + ' → ' + g.s.res.stability.toFixed(1) + ' after burning out');

    // 2 Friend network
    g = game(2);
    g.s.run.time = 60;
    const att0 = g.m.attMult;
    ok(Z.mech.act(g, 'connect'), 'friend request sent');
    ok(!Z.mech.act(g, 'connect'), 'second request waits for the cooldown');
    run(g, 13);
    ok(Z.mech.act(g, 'connect'), 'request possible again after 12 s');
    g.refresh();
    ok(near(g.m.attMult, att0 * (1 + 0.015 * 2), 1e-6), '2 connections → Attention +3% (×' + (g.m.attMult / att0).toFixed(3) + ')');
    g.s.run.connections = 20; g.s.mech.cd = 0;
    ok(!Z.mech.act(g, 'connect'), 'no more than 20 connections');

    // 3 Trend alerts
    g = game(3);
    g.s.run.time = 60;
    ok(run(g, 80, 0.5, x => !!x.s.mech.active), 'trend alert within ~1 minute');
    ok(Z.mech.act(g, 'ride'), 'jumped on the trend');
    ok(g.s.buffs.some(b => b.key === 'trendWave'), 'trend wave buff');
    eq(g.s.flags.ev['mech:trend'], 1, 'trend counted (Viral Streak)');
    ok(run(g, 200, 0.5, x => !!x.s.mech.active), 'next trend arrives');
    run(g, 25, 0.5, x => !x.s.mech.active);
    ok(!g.s.mech.active, 'ignored trend expires');

    // 4 Feed mode
    g = game(4);
    g.s.run.time = 60;
    const base = g.m.attMult;
    ok(Z.mech.act(g, 'feed2'), 'switched to Max engagement');
    g.refresh();
    ok(near(g.m.attMult, base * 1.35, 1e-6) && g.m.drainMult > 1, 'Max engagement: Attention ×1.35, faster drain');
    Z.mech.act(g, 'feed0'); g.refresh();
    ok(near(g.m.attMult, base * 0.85, 1e-6) && g.m.regenMult > 1, 'Calm: Attention ×0.85, faster repair');
    ok(!Z.mech.act(g, 'feed0'), 'same mode twice does nothing');
    ok(Z.mech.view(g).buttons.find(b => b.id === 'feed0').on, 'window marks the chosen mode');

    // 5 AI claims
    g = game(5);
    g.s.run.time = 60;
    ok(run(g, 80, 0.5, x => !!x.s.mech.active), 'AI claim within ~1 minute');
    ok(Z.mech.act(g, 'check'), 'fact-checked');
    let trusts = 0, trueCount = 0;
    for (let i = 0; i < 40; i++) {
      run(g, 200, 0.5, x => !!x.s.mech.active);
      if (!g.s.mech.active) break;
      if (g.s.mech.active.real) trueCount++;
      Z.mech.act(g, 'trust'); trusts++;
    }
    eq(g.s.flags.ev['mech:ai'], trusts + 1, 'every answer counts (Fact-Checker)');
    note(trueCount + ' of ' + trusts + ' claims were true (60% expected)');

    // 6 Quarterly targets
    g = game(6);
    g.s.run.time = 60;
    run(g, 1);
    ok(g.s.mech.q && g.s.mech.q.time > 0, 'first quarter started');
    // A quarter is judged on its average Money/s: money earned since it started ÷ 180 s
    const q = g.s.mech.q;
    q.target = 1000; q.time = 0.5; q.from = g.s.run.money - 1000 * 179.5 * 1.05;
    run(g, 0.5);
    eq(g.s.flags.ev['mech:quarterWin'], 1, 'average 5% above the target hits it');
    ok(near(g.s.mech.q.target, 1000 * 1.05 * 1.2, 0.01), 'next target = this quarter’s average × 1.2 (' + Z.fmt.money(g.s.mech.q.target) + '/s)');
    g.s.mech.q.time = 0.5; g.s.mech.q.from = g.s.run.money - g.s.mech.q.target * 179.5 * 0.9;
    run(g, 0.5);
    ok(mechLog(g).some(n => n.title === 'Quarterly target missed'), 'average 10% below the target misses it');
    g.s.mech.q.time = 90; g.s.mech.q.from = g.s.run.money - 500 * 90;
    ok(/so far \$500/.test(Z.mech.view(g).text), 'window shows the average so far: ' + Z.mech.view(g).text);

    // 7 Bot swarms
    g = game(7);
    g.s.run.time = 60;
    let friendly = 0, hostile = 0, kept = 0;
    for (let i = 0; i < 30; i++) {
      if (!run(g, 200, 0.5, x => !!x.s.mech.active)) break;
      if (i % 3 === 2) { Z.mech.act(g, 'keepout'); kept++; continue; }
      if (g.s.mech.active.friendly) friendly++; else hostile++;
      Z.mech.act(g, 'letin');
    }
    eq(g.s.flags.ev['mech:botsGood'] || 0, friendly, 'friendly swarms counted (Bot Whisperer)');
    note(friendly + ' friendly, ' + hostile + ' hostile, ' + kept + ' kept out');

    // Window content for every era once started
    for (let era = 1; era <= 7; era++) {
      const gx = game(era);
      gx.s.run.time = 60;
      run(gx, 2);
      const v = Z.mech.view(gx);
      ok(v && v.title && v.text, 'era ' + era + ' window: ' + (v ? v.title : 'nothing'));
    }
  });

  /* ================= 3. Era records ================= */
  group('3 · Era records', () => {
    const g = game(1), s = g.s;
    for (const time of [1500, 1100, 1300]) {
      s.run.time = time;
      s.run.attention = Z.prestige.requirement(s);
      Z.prestige.prestige(g);
      s.era = 1; Z.prestige.resetRun(g);
    }
    eq(s.history.length, 3, 'three finished eras recorded');
    eq(Z.meta.bestTimes(s)[1].time, 1100, 'best time picks the fastest run');
    const h = s.history[0];
    ok(['era', 'time', 'clout', 'attention', 'money', 'meltdowns', 'clicks', 'upgrades', 'os', 'challenges', 'at'].every(k => k in h), 'record has every field');
    for (let i = 0; i < 230; i++) { s.run.attention = Z.prestige.requirement(s); Z.prestige.prestige(g); s.era = 1; Z.prestige.resetRun(g); }
    eq(s.history.length, 200, 'history is capped at 200');
  });

  /* ================= 4. Daily challenge ================= */
  group('4 · Daily challenge', () => {
    const a = game(1).s, b = game(1).s;
    Z.meta.ensureDaily(a, '2026-10-07');
    Z.meta.ensureDaily(b, '2026-10-07');
    ok(a.daily.mod === b.daily.mod && a.daily.goal === b.daily.goal, 'same day → same challenge for everyone (' + a.daily.mod + ' / ' + a.daily.goal + ')');
    const mods = new Set(), goals = new Set();
    for (let d = 1; d <= 60; d++) {
      const x = game(1).s;
      Z.meta.ensureDaily(x, Z.meta.dayKey(new Date(2026, 9, d)));
      mods.add(x.daily.mod); goals.add(x.daily.goal);
    }
    ok(mods.size >= 7 && goals.size >= 6, '60 days use ' + mods.size + '/9 modifiers and ' + goals.size + '/7 goals');
    ok(!Z.meta.ensureDaily(a, '2026-10-07'), 'same day does not restart');

    // Every modifier changes the game
    for (const mod of Z.DAILY_MODS) {
      const g = game(1);
      g.s.daily.mod = ''; g.dirty = true; g.refresh();
      const before = JSON.stringify(g.m);
      g.s.daily.mod = mod.id; g.s.flags.reveal.daily = true; g.dirty = true; g.refresh();
      ok(JSON.stringify(g.m) !== before, 'modifier ' + mod.id + ' changes the game');
    }
    // Only while the daily feature is shown
    const g0 = game(1);
    g0.s.daily.mod = 'clickday'; g0.s.flags.reveal.daily = false;
    ok(!Z.meta.dailyActive(g0.s), 'modifier inactive until the daily challenge is introduced');

    // Goal progress, reward, streak
    const g = game(1), s = g.s;
    s.flags.reveal.daily = true;
    s.cloutLifetime = 1000;
    const day = k => Z.meta.dayKey(new Date(2026, 9, k));
    const finish = () => { const goal = Z.DAILY_GOAL[s.daily.goal]; s.stats[goal.stat] = s.daily.base + goal.need; Z.meta.checkDaily(g); };
    Z.meta.ensureDaily(s, day(1));
    s.daily.goal = 'clicks'; s.daily.base = s.stats.totalClicks;
    for (let i = 0; i < 10; i++) Z.econ.click(g);
    eq(Z.meta.dailyProgress(s).have, 10, 'real clicks count toward the goal');
    const clout0 = s.clout;
    finish();
    ok(s.daily.done && s.clout > clout0, 'goal done, +' + (s.clout - clout0) + ' Clout');
    eq(s.daily.streak, 1, 'streak 1');
    const c1 = s.clout; Z.meta.checkDaily(g);
    eq(s.clout, c1, 'reward paid only once');
    // Reward = 2% of lifetime Clout × (1 + 25% per streak day, up to day 7)
    const factors = [];
    for (let k = 2; k <= 9; k++) {
      Z.meta.ensureDaily(s, day(k));
      const life = s.cloutLifetime, r0 = s.clout;
      finish();
      factors.push(((s.clout - r0) / (life * 0.02)).toFixed(2));
    }
    eq(s.daily.streak, 9, '9 days in a row → streak 9');
    const want = [1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.5, 2.5];
    ok(factors.every((x, i) => Math.abs(x - want[i]) < 0.05), 'streak bonus grows to day 7, then stays: ×' + factors.join(' ×'));
    Z.meta.ensureDaily(s, day(12));
    eq(s.daily.streak, 0, 'a missed day resets the streak');
    finish();
    eq(s.daily.streak, 1, 'new streak starts at 1');
    Z.meta.ensureDaily(s, day(13));
    eq(s.daily.streak, 1, 'streak kept overnight before today is done');
  });

  /* ================= 5. Operating systems ================= */
  group('5 · Operating systems (incl. Prism OS and ChaosOS 95)', () => {
    eq(Z.OSES.map(o => o.id).join(','), 'aero,metro,mango,holo,retro', 'five systems in order');
    const known = ['clickMult', 'attMult', 'yieldMult', 'pressureMult', 'controlMult', 'capacityMult', 'regenMult', 'drainMult', 'meltdownMult', 'modPenalty', 'goodEvents', 'badSeverity', 'buffDuration', 'hotfixCooldown', 'costMult', 'crashGuard',
      'attBonus', 'clickFlat', 'clickAps', 'chaosAtt', 'chaosYield', 'tolerance', 'hotfixPower', 'autoClick', 'offlineCap', 'offlineEff', 'trendMult', 'meltdownStability', 'autobuySpeed', 'stabilityBonus',
      'autoHotfix', 'autobuy', 'riskManager', 'prAutopilot', 'scheduler', 'bMult', 'synergy', 'policy', 'action'];
    const unknown = [];
    const scan = (where, list) => { for (const e of list || []) if (known.indexOf(e.t) < 0) unknown.push(where + ':' + e.t); };
    for (const o of Z.OSES) scan('os ' + o.id, o.effects);
    for (const m of Z.DAILY_MODS) scan('daily ' + m.id, m.effects);
    for (const u of Z.UPGRADES) scan('upgrade ' + u.id, u.effects);
    for (const p of Z.PERKS) scan('perk ' + p.id, p.effects);
    for (const u of Z.REBOOT_UPGRADES) scan('bandwidth ' + u.id, u.effects);
    for (const p of Z.PROTOCOLS) scan('protocol ' + p.id, p.effects);
    eq(unknown.join(' '), '', 'every effect type is one the game understands');

    let prev = null;
    for (let k = 0; k < Z.OSES.length; k++) {
      const o = Z.OSES[k];
      const g = game(7, o.id);
      if (k > 0) {
        ok(o.name && o.edition && o.cost > 0 && o.era >= 1 && o.effects.length > 0, o.name + ' ' + o.edition + ': era ' + o.era + ', cost ' + Z.fmt.money(o.cost));
        ok(JSON.stringify(g.m) !== prev, o.name + ' adds its own bonuses');
      }
      prev = JSON.stringify(g.m);
      const set = Z.COSMETICS.setFor(o.id), def = Z.COSMETICS.defaultsFor(o.id);
      const items = set.reduce((n, c) => n + c.items.length, 0);
      ok(Object.keys(def).every(cat => Z.COSMETICS.ITEM[cat + ':' + def[cat]]), o.id + ': default theme exists (' + items + ' Style Shop items)');
    }
    // Stacking: the retro system keeps Prism OS's auto-clicks

  }
  const failed = total - pass;
  document.getElementById('sum').textContent = failed ? failed + ' of ' + total + ' checks FAILED' : 'All ' + total + ' checks passed';
  document.getElementById('sum').className = failed ? 'bad' : 'ok';
  document.title = failed ? 'FAILED ' + failed + '/' + total : 'passed ' + total + '/' + total;
  window.SELFTEST = results;
})();
</script>
</body>
</html>
